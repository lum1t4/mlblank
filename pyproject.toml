[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlblank"
version = "0.0.1"
description = "Pytorch based machine learning"
authors = [
  { name = "Gianluca Calò" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.11"
dependencies = [
    "albumentations>=2.0.5",
    "dill>=0.3.9",
    "ipython>=9.0.2",
    "matplotlib>=3.10.1",
    "numpy>=2.2.4",
    "opencv-contrib-python>=4.12.0.88",
    "pandas>=2.2.3",
    "pillow>=11.1.0",
    "psutil>=7.0.0",
    "py-cpuinfo>=9.0.0",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "safetensors>=0.5.3",
    "scipy>=1.15.2",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "torchmetrics>=1.7.4",
    "torchvision>=0.21.0",
    "tqdm>=4.67.1",
    "ultralytics-thop>=2.0.14",
    "wandb>=0.19.8",
]

[project.optional-dependencies]
wandb = [
    "wandb>=0.19.8",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known-first-party = ["wv"]
force-sort-within-sections = true

[tool.uv.sources]
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

[dependency-groups]
dev = [
    "boto3>=1.37.1",
    "dvc>=3.59.1",
    "dvc-s3>=3.2.0",
    "ortools>=9.12.4544",
    "segment-anything",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "ruff>=0.12.3",
    "nbconvert>=7.17.0",
]

